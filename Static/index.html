<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Technical Review System: Artificial Intelligence</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../Assets/styles.css" />
    <script src="../Assets/index.js"></script>
  </head>
  <body class="d-flex justify-content-center align-items-center vh-100">
    <div>
      <h1 id="title">Smart Technical Review System</h1>

      <!-- Change your action url accordingly -->
      <form method="POST" action="/upload" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="emailaddress" class="form-label">Email address</label>
          <input
            name="emailaddress"
            type="email"
            class="form-control"
            id="emailaddress"
            aria-describedby="emailHelp"
          />
          <div id="emailHelp" class="form-text">
            We'll never share your email with anyone else.
          </div>
        </div>
        <div class="mb-3">
          <label for="users_name" class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            id="users_name"
            name="users_name"
          />
        </div>
        <div class="mb-3">
          <label for="users_phone" class="form-label">Phone Number</label>
          <input
            type="number"
            class="form-control"
            id="users_phone"
            name="users_phone"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="upload_pdf">Upload PDF</label>
          <input
            type="file"
            class="form-control"
            id="upload_pdf"
            name="upload_pdf"
          />
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</html>
